<!DOCTYPE html>
<html>
<head>
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
</head>
<body>
  <div id="mynetwork" style="width: 400px; height: 400px; border: 1px solid lightgray;"></div>
  <script>
    var container = document.getElementById('mynetwork');
    var nodes = new vis.DataSet([{id: 1, label: 'Node 1'}, {id: 2, label: 'Node 2'}]);
    var edges = new vis.DataSet([{from: 1, to: 2, color: { color: { color: 'red' } } }]);
    try {
        var network = new vis.Network(container, {nodes: nodes, edges: edges}, {});
        console.log("Success");
    } catch (e) {
        console.error(e);
        document.body.innerHTML += "ERROR: " + e.message;
    }
  </script>
</body>
</html>
